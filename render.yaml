# Render blueprint. Two services, and the difference between them matters.
#
#   pilates-yoga-studio   the whole thing: the 3D body, the lab, and the Record
#                         button, because Python is running behind it
#   pilates-yoga-viewer   the anatomy application and a sample session, static,
#                         no analysis, free
#
# **The static site cannot record, and now says so instead of saying nothing.**
# The page asks `/capabilities` before it offers to analyse anything; on a static
# host that request 404s. It used to draw no Record button at all in that case,
# on the reasoning that a button which offers to analyse a clip and then cannot
# is worse than no button. That reasoning is wrong in practice: the first thing
# anybody looks for here is where to record, and a blank header answers by
# implying the camera half was never built. So the viewer draws the button too,
# greyed, and pressing it says which half is missing and how to start it. If you
# are looking for where to *actually* record, it is the **studio** service below,
# or `python -m pilates web` on your own machine.
#
# **Hosting the analysis is a real trade.** It means video of people leaves the
# building, which is the one thing this design otherwise avoids: the clip is
# deleted the moment the job ends, but it still travelled. Running it locally is
# the honest default. This service exists so the thing can be shown to somebody
# who has not installed it.
services:
  # ----------------------------------------------------------------- studio
  # Python, so the camera and the upload work. The pose model is about ninety
  # megabytes and is fetched on the first analysis, not at build time -- a build
  # that downloads it would time out and a service that pre-warms it would pay
  # for the download on every deploy.
  - type: web
    name: pilates-yoga-studio
    runtime: python
    plan: starter          # free tier sleeps and has too little memory for onnxruntime
    buildCommand: pip install -r requirements.txt
    # --host 0.0.0.0 because the platform's router is a different machine, and
    # $PORT is honoured by the server itself. There is no authentication in
    # front of this: put Render's own access control on it before it holds
    # anybody's real class.
    startCommand: python -m pilates web --host 0.0.0.0
    healthCheckPath: /capabilities
    envVars:
      # Where rtmlib caches the pose model. Render's disk is ephemeral, so this
      # is re-fetched after a deploy; that is one download, not one per request.
      - key: XDG_CACHE_HOME
        value: /opt/render/project/.cache
      - key: PYTHONUNBUFFERED
        value: "1"

  # ----------------------------------------------------------------- viewer
  # Everything the application needs is committed, so there is no build step.
  - type: web
    name: pilates-yoga-viewer
    runtime: static
    staticPublishPath: ./web
    buildCommand: ""
    headers:
      # Twenty-five megabytes of anatomy that changes only when the model is
      # rebuilt. Without this every visit re-downloads the body.
      - path: /models/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=604800
      # The sample session is regenerated whenever the bundle format changes,
      # and a stale one would be validated against a newer viewer and refused.
      - path: /demo/*
        name: Cache-Control
        value: public, max-age=300

# There is deliberately no `routes:` block on the static site, and this is the
# one thing not to "fix" later. Render evaluates rewrites *before* it looks for
# a file, so the usual single-page-app catch-all -- /* to /index.html -- would
# return the HTML page for src/main.js and for every GLB, and the application
# would not start. It has no client-side routing: it is one page that fetches
# its assets by path. Inherited from the anatomy project's own blueprint, which
# learned it the hard way; see web/render.yaml.
