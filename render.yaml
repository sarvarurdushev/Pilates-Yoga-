# Render blueprint: the anatomy application, with a demonstration session in it.
#
# A static site, because that is what the application is. Everything it needs is
# committed -- index.html, src/, vendor/three, the GLB models, and the session
# layer -- so there is no build step and nothing to install. The Python half of
# this repository does not run here: it is what *produces* a session bundle, and
# a bundle is a file.
#
# What that means for a real deployment: the demo bundle under `web/demo/` is
# generated by `python -m pilates demo` and committed. A studio serving real
# students would not commit theirs -- a bundle is one person's health data, and
# a static host has no way to ask who is asking. That deployment wants
# `python -m pilates web`, which serves the same directory and hands the bundle
# out of memory over a link that can be taken away.
services:
  - type: web
    name: pilates-yoga-body
    runtime: static
    # The application lives in web/; the repository root is a Python package.
    staticPublishPath: ./web
    buildCommand: ""
    headers:
      # Twenty-five megabytes of anatomy that changes only when the model is
      # rebuilt. Without this every visit re-downloads the body.
      - path: /models/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=604800
      # The demo session is regenerated whenever the bundle format changes, and
      # a stale one would be validated against a newer viewer and refused.
      - path: /demo/*
        name: Cache-Control
        value: public, max-age=300

# There is deliberately no `routes:` block, and this is the one thing not to
# "fix" later. Render evaluates rewrites *before* it looks for a file, so the
# usual single-page-app catch-all -- /* to /index.html -- would return the HTML
# page for src/main.js and for every GLB, and the application would not start.
# It has no client-side routing: it is one page that fetches its assets by path.
# Inherited from the anatomy project's own blueprint, which learned it the hard
# way; see web/render.yaml.
